name: auto_learn

on:
  schedule:
    - cron: "15 */3 * * *"   # toutes les 3 h
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "fly-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Auto-learn cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -c "from agent.auto_learn import run_auto_learn; run_auto_learn()"

      - name: Commit state
        run: |
          git add state/
          git commit -m "auto_learn: seed frontier from skill branch" || echo "nothing"
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "push failed"
