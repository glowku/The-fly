<!DOCTYPE html>

</head>
<body style="background:#040604;color:#5dba4a;font:12px monospace;padding:20px">
Chargement du graphe neural…
<script>
Promise.all([
  fetch('fb_part_0.txt?t='+Date.now()).then(r=>r.text()),
  fetch('fb_part_1.txt?t='+Date.now()).then(r=>r.text()),
  fetch('fb_part_2.txt?t='+Date.now()).then(r=>r.text()),
  fetch('fb_part_3.txt?t='+Date.now()).then(r=>r.text()),
  fetch('fb_part_4.txt?t='+Date.now()).then(r=>r.text()),
  fetch('fb_part_5.txt?t='+Date.now()).then(r=>r.text()),
  fetch('fb_part_6.txt?t='+Date.now()).then(r=>r.text()),
  fetch('fb_part_7.txt?t='+Date.now()).then(r=>r.text()),
  fetch('fb_part_8.txt?t='+Date.now()).then(r=>r.text())
]).then(parts => {
  const B64 = parts.join("");
  const bin = Uint8Array.from(atob(B64), c => c.charCodeAt(0));
  const html = pako.ungzip(bin, {to: "string"});
  document.open();
  document.write(html);
  document.close();
}).catch(e => { document.body.textContent = "Erreur: " + e; });
</script>
</body>
</html>
