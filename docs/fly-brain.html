<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>The-fly — FlyBrain</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #121a2f;
    --line: #1e2a4a;
    --text: #e8eefc;
    --muted: #8b9bb8;
    --accent: #5eead4;
    --accent2: #818cf8;
    --danger: #f87171;
    --node: #38bdf8;
    --frontier: #64748b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 360px; height: 100vh; }
  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; }
  }
  #stage { position: relative; overflow: hidden; border-right: 1px solid var(--line); }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #hud {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  .pill {
    background: rgba(18,26,47,.9); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; color: var(--muted);
  }
  .pill strong { color: var(--accent); font-weight: 600; }
  button.tool {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  button.tool:hover { border-color: var(--accent); color: var(--accent); }
  #side {
    display: flex; flex-direction: column; background: var(--panel);
    min-height: 0;
  }
  #side header {
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  #side header h1 {
    margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .02em;
  }
  #side header p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }
  #tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); }
  #tabs button {
    flex: 1; background: transparent; border: 0; color: var(--muted);
    padding: 10px; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  #tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .pane { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .pane.active { display: flex; }
  #nodeInfo { padding: 12px 16px; overflow: auto; font-size: 13px; line-height: 1.45; }
  #nodeInfo h2 { margin: 0 0 8px; font-size: 16px; }
  #nodeInfo .meta { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
  #nodeInfo pre {
    white-space: pre-wrap; background: #0b1020; border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; font-size: 12px; max-height: 40vh; overflow: auto;
  }
  #chatLog {
    flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 95%; padding: 10px 12px; border-radius: 12px; font-size: 13px;
    line-height: 1.45; white-space: pre-wrap;
  }
  .msg.user { align-self: flex-end; background: #1e3a5f; }
  .msg.bot { align-self: flex-start; background: #162033; border: 1px solid var(--line); }
  .msg .src { margin-top: 8px; font-size: 11px; color: var(--muted); }
  #chatForm {
    display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line);
  }
  #chatForm input {
    flex: 1; background: #0b1020; border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font-size: 13px;
  }
  #chatForm button {
    background: linear-gradient(135deg, var(--accent2), #38bdf8); color: #0b1020;
    border: 0; border-radius: 10px; padding: 0 14px; font-weight: 700; cursor: pointer;
  }
  #statusBar {
    padding: 8px 12px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line);
  }
  #statusBar.ok { color: var(--accent); }
  #statusBar.bad { color: var(--danger); }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="pill">nœuds <strong id="nNodes">—</strong></div>
      <div class="pill">arêtes <strong id="nEdges">—</strong></div>
      <div class="pill">frontier <strong id="nFront">—</strong></div>
      <div class="pill">root <strong id="nRoot">—</strong></div>
      <button class="tool" id="btnReload">reload</button>
      <button class="tool" id="btnFit">fit</button>
    </div>
  </div>
  <aside id="side">
    <header>
      <h1>🪰 FlyBrain</h1>
      <p>Graphe vivant + chat ancré wiki / arXiv</p>
    </header>
    <div id="tabs">
      <button type="button" class="active" data-tab="chat">Chat</button>
      <button type="button" data-tab="node">Nœud</button>
    </div>
    <div id="pane-chat" class="pane active">
      <div id="chatLog"></div>
      <form id="chatForm">
        <input id="q" placeholder="Ex: comment les haltères stabilisent le vol ?" autocomplete="off"/>
        <button type="submit">→</button>
      </form>
      <div id="statusBar">API locale : recherche…</div>
    </div>
    <div id="pane-node" class="pane">
      <div id="nodeInfo"><p style="color:var(--muted)">Clique un nœud du graphe.</p></div>
    </div>
  </aside>
</div>
<script>
(function () {
  const RAW = "https://raw.githubusercontent.com/glowku/The-fly/main/";
  const API_CANDIDATES = ["http://127.0.0.1:8765", "http://localhost:8765"];
  let apiBase = null;
  let coverage = { root: "Fly", nodes: {}, edges: [], frontier: [] };
  let quality = {};
  let nodes = [];
  let links = [];
  let selected = null;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, dpr = 1;
  let cam = { x: 0, y: 0, scale: 1 };
  let dragging = null, panning = null;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const r = canvas.parentElement.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  async function fetchJSON(url) {
    const r = await fetch(url + "?t=" + Date.now());
    if (!r.ok) throw new Error(url + " " + r.status);
    return r.json();
  }

  async function loadData() {
    const tries = [
      "../state/coverage.json",
      RAW + "state/coverage.json",
    ];
    const qtries = [
      "../state/quality.json",
      RAW + "state/quality.json",
    ];
    for (const u of tries) {
      try { coverage = await fetchJSON(u); break; } catch (e) {}
    }
    for (const u of qtries) {
      try { quality = await fetchJSON(u); break; } catch (e) {}
    }
    buildGraph();
    document.getElementById("nNodes").textContent = Object.keys(coverage.nodes || {}).length;
    document.getElementById("nEdges").textContent = (coverage.edges || []).length;
    document.getElementById("nFront").textContent = (coverage.frontier || []).length;
    document.getElementById("nRoot").textContent = coverage.root || "?";
  }

  function buildGraph() {
    const nodeMap = new Map();
    const titles = new Set([
      ...Object.keys(coverage.nodes || {}),
      ...(coverage.frontier || []),
    ]);
    titles.forEach((t, i) => {
      const info = (coverage.nodes || {})[t];
      const isFront = !info && (coverage.frontier || []).includes(t);
      const angle = (i / Math.max(titles.size, 1)) * Math.PI * 2;
      const rad = 80 + (info?.depth || 3) * 40;
      nodeMap.set(t, {
        id: t,
        x: Math.cos(angle) * rad,
        y: Math.sin(angle) * rad,
        vx: 0, vy: 0,
        depth: info?.depth || 9,
        frontier: isFront,
        q: (quality[t] || {}).score,
      });
    });
    links = [];
    for (const e of coverage.edges || []) {
      if (nodeMap.has(e.from) && nodeMap.has(e.to)) {
        links.push({ source: nodeMap.get(e.from), target: nodeMap.get(e.to) });
      }
    }
    nodes = [...nodeMap.values()];
    // seed root near center
    const root = nodeMap.get(coverage.root) || nodes[0];
    if (root) { root.x = 0; root.y = 0; }
  }

  function step() {
    const n = nodes.length || 1;
    // repulsion
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let dist2 = dx * dx + dy * dy || 0.01;
        let dist = Math.sqrt(dist2);
        let f = 1200 / dist2;
        let fx = (dx / dist) * f, fy = (dy / dist) * f;
        a.vx += fx; a.vy += fy;
        b.vx -= fx; b.vy -= fy;
      }
    }
    // springs
    for (const l of links) {
      const a = l.source, b = l.target;
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
      let f = (dist - 90) * 0.02;
      let fx = (dx / dist) * f, fy = (dy / dist) * f;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }
    // center gravity
    for (const a of nodes) {
      a.vx += -a.x * 0.002;
      a.vy += -a.y * 0.002;
      a.vx *= 0.85; a.vy *= 0.85;
      if (dragging !== a) {
        a.x += a.vx; a.y += a.vy;
      }
    }
  }

  function worldFromEvent(ev) {
    const r = canvas.getBoundingClientRect();
    const x = (ev.clientX - r.left - W / 2) / cam.scale - cam.x;
    const y = (ev.clientY - r.top - H / 2) / cam.scale - cam.y;
    return { x, y };
  }

  function hit(x, y) {
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      const rad = n.frontier ? 5 : 7 + Math.min(4, (n.q || 5) / 3);
      const dx = n.x - x, dy = n.y - y;
      if (dx * dx + dy * dy < (rad + 4) * (rad + 4) / (cam.scale * cam.scale) * cam.scale) {
        // simpler hit in world coords
      }
      if (dx * dx + dy * dy < (rad + 6) * (rad + 6)) return n;
    }
    return null;
  }

  canvas.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const f = ev.deltaY > 0 ? 0.9 : 1.1;
    cam.scale = Math.min(3, Math.max(0.2, cam.scale * f));
  }, { passive: false });

  canvas.addEventListener("pointerdown", (ev) => {
    canvas.setPointerCapture(ev.pointerId);
    const w = worldFromEvent(ev);
    const n = hit(w.x, w.y);
    if (n) {
      dragging = n;
      selected = n;
      showNode(n);
      document.querySelector('[data-tab="node"]').click();
    } else {
      panning = { x: ev.clientX, y: ev.clientY, cx: cam.x, cy: cam.y };
      canvas.classList.add("dragging");
    }
  });
  canvas.addEventListener("pointermove", (ev) => {
    if (dragging) {
      const w = worldFromEvent(ev);
      dragging.x = w.x; dragging.y = w.y;
      dragging.vx = dragging.vy = 0;
    } else if (panning) {
      cam.x = panning.cx + (ev.clientX - panning.x) / cam.scale;
      cam.y = panning.cy + (ev.clientY - panning.y) / cam.scale;
    }
  });
  canvas.addEventListener("pointerup", () => {
    dragging = null; panning = null; canvas.classList.remove("dragging");
  });

  function draw() {
    step();
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(cam.scale, cam.scale);
    ctx.translate(cam.x, cam.y);

    ctx.lineWidth = 1 / cam.scale;
    for (const l of links) {
      ctx.strokeStyle = "rgba(94,234,212,0.18)";
      ctx.beginPath();
      ctx.moveTo(l.source.x, l.source.y);
      ctx.lineTo(l.target.x, l.target.y);
      ctx.stroke();
    }
    for (const n of nodes) {
      const rad = n.frontier ? 4.5 : 6 + Math.min(5, (n.q || 6) / 2.5);
      ctx.beginPath();
      ctx.fillStyle = n.frontier ? varFrontier() : (n === selected ? "#fbbf24" : colorFor(n));
      ctx.arc(n.x, n.y, rad, 0, Math.PI * 2);
      ctx.fill();
      if (cam.scale > 0.55 || n === selected || n.depth <= 2) {
        ctx.fillStyle = "rgba(232,238,252,0.85)";
        ctx.font = `${11 / cam.scale}px ui-sans-serif,system-ui`;
        ctx.fillText(n.id, n.x + rad + 3, n.y + 3);
      }
    }
    ctx.restore();
    requestAnimationFrame(draw);
  }
  function varFrontier() { return "#64748b"; }
  function colorFor(n) {
    const d = n.depth || 1;
    if (d <= 1) return "#5eead4";
    if (d === 2) return "#38bdf8";
    if (d === 3) return "#818cf8";
    return "#a78bfa";
  }

  async function showNode(n) {
    const box = document.getElementById("nodeInfo");
    box.innerHTML = `<h2>${escapeHtml(n.id)}</h2>
      <div class="meta">depth=${n.depth} · quality=${n.q ?? "—"} · ${n.frontier ? "frontier" : "wiki"}</div>
      <p style="color:var(--muted)">Chargement article…</p>`;
    let text = "";
    const paths = [
      `../wiki/${encodeURIComponent(n.id)}.md`,
      RAW + `wiki/${encodeURIComponent(n.id)}.md`,
    ];
    for (const u of paths) {
      try {
        const r = await fetch(u + "?t=" + Date.now());
        if (r.ok) { text = await r.text(); break; }
      } catch (e) {}
    }
    box.innerHTML = `<h2>${escapeHtml(n.id)}</h2>
      <div class="meta">depth=${n.depth} · quality=${n.q ?? "—"}</div>
      <pre>${escapeHtml(text || "(pas d'article markdown local / raw)")}</pre>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // tabs
  document.getElementById("tabs").addEventListener("click", (ev) => {
    const b = ev.target.closest("button[data-tab]");
    if (!b) return;
    document.querySelectorAll("#tabs button").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".pane").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById("pane-" + b.dataset.tab).classList.add("active");
  });

  document.getElementById("btnReload").onclick = () => loadData();
  document.getElementById("btnFit").onclick = () => { cam = { x: 0, y: 0, scale: 1 }; };

  // Chat
  const log = document.getElementById("chatLog");
  const status = document.getElementById("statusBar");

  function addMsg(role, text, sources) {
    const d = document.createElement("div");
    d.className = "msg " + role;
    d.textContent = text;
    if (sources && sources.length) {
      const s = document.createElement("div");
      s.className = "src";
      s.textContent = "sources: " + sources.join(" · ");
      d.appendChild(s);
    }
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  async function probeAPI() {
    for (const base of API_CANDIDATES) {
      try {
        const r = await fetch(base + "/health", { signal: AbortSignal.timeout(800) });
        if (r.ok) {
          apiBase = base;
          status.textContent = "API LLM locale OK · " + base;
          status.className = "ok";
          return;
        }
      } catch (e) {}
    }
    apiBase = null;
    status.textContent = "Mode extractif (Pages) — lance run_chat_server.py pour le LLM";
    status.className = "bad";
  }

  function extractiveAnswer(q) {
    const words = q.toLowerCase().split(/[^a-z0-9àâäéèêëïîôùûüç]+/).filter(w => w.length > 2);
    const scored = nodes.map(n => {
      const blob = n.id.toLowerCase();
      const hits = words.reduce((a, w) => a + (blob.includes(w) ? 1 : 0), 0);
      return { n, hits, q: n.q || 0 };
    }).filter(x => x.hits > 0).sort((a, b) => b.hits - a.hits || b.q - a.q).slice(0, 5);
    if (!scored.length) {
      return { answer: "Aucun nœud du graphe ne matche clairement. Relance avec des termes insecte / vol / évolution, ou démarre le serveur local.", sources: [] };
    }
    const lines = scored.map(x => `• ${x.n.id} (depth ${x.n.depth}, q=${x.n.q ?? "—"})`);
    return {
      answer: "Réponse extractive (sans LLM) — nœuds proches :\n" + lines.join("\n") + "\n\nPour une réponse synthétique grounded wiki+arXiv :\npython run_chat_server.py",
      sources: scored.map(x => x.n.id),
    };
  }

  document.getElementById("chatForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const input = document.getElementById("q");
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    addMsg("user", q);
    addMsg("bot", "…");
    const pending = log.lastChild;
    try {
      if (!apiBase) await probeAPI();
      let res;
      if (apiBase) {
        const r = await fetch(apiBase + "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q, use_arxiv: true, k: 6 }),
        });
        res = await r.json();
      } else {
        res = extractiveAnswer(q);
      }
      pending.textContent = res.answer || JSON.stringify(res);
      if (res.sources && res.sources.length) {
        const s = document.createElement("div");
        s.className = "src";
        s.textContent = "wiki: " + res.sources.join(" · ");
        pending.appendChild(s);
      }
      if (res.arxiv && res.arxiv.length) {
        const s = document.createElement("div");
        s.className = "src";
        s.textContent = "arXiv: " + res.arxiv.slice(0, 3).map(p => p.title).join(" · ");
        pending.appendChild(s);
      }
    } catch (e) {
      pending.textContent = "Erreur: " + e.message;
    }
  });

  addMsg("bot", "Salut — je réponds depuis le noyau wiki The-fly. Lance `python run_chat_server.py` + export GROQ_API_KEY pour le mode LLM + arXiv.");
  loadData().then(() => { requestAnimationFrame(draw); probeAPI(); });
})();
</script>
</body>
</html>
