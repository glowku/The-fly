<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>the-fly · brain</title>
<style>
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #040604; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #040604; }

  /* === HUD Cortex — même design que le graphe (vert mono) === */
  #evolution-hud {
    position: fixed;
    left: 12px;
    bottom: 12px;
    z-index: 50;
    width: 280px;
    max-height: min(42vh, 380px);
    overflow-y: auto;
    background: rgba(4, 8, 4, 0.94);
    border: 1px solid #1a261a;
    color: #c4d0c4;
    font: 11.5px/1.4 ui-monospace, Consolas, monospace;
    box-shadow: 0 8px 28px rgba(0,0,0,0.55);
  }
  #evolution-hud.collapsed { max-height: 36px; overflow: hidden; }
  .hud-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 10px; border-bottom: 1px solid #1a261a;
    color: #5dba4a; text-transform: uppercase; letter-spacing: .07em;
    font-size: 11px; cursor: pointer; user-select: none;
  }
  .hud-badge {
    padding: 1px 7px; border-radius: 3px; font-weight: 700; font-size: 10px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .badge-pass { background: rgba(93,186,74,0.15); color: #5dba4a; border: 1px solid #3a5a3a; }
  .badge-rollback { background: rgba(200,80,60,0.18); color: #e07a6a; border: 1px solid #5a3a3a; }
  .badge-idle { background: rgba(90,106,90,0.2); color: #7a8a7a; border: 1px solid #2a3a2a; }

  .hud-body { padding: 8px 10px 10px; }
  .hud-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 8px;
  }
  .hud-stat {
    background: #0a0e0a; border: 1px solid #1a261a; padding: 5px 4px;
    text-align: center; border-radius: 2px;
  }
  .hud-stat b { display: block; font-size: 13px; color: #5dba4a; font-weight: 700; }
  .hud-stat span { color: #5a6a5a; font-size: 9.5px; text-transform: uppercase; letter-spacing: .03em; }

  .hud-section-title {
    color: #5dba4a; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    margin: 8px 0 4px; opacity: 0.9;
  }
  #skill-legend { max-height: 110px; overflow-y: auto; }
  .skill-chip {
    display: flex; align-items: center; justify-content: space-between;
    padding: 3px 6px; margin: 2px 0; background: #0a0e0a; border: 1px solid #141a14;
    border-left: 3px solid transparent; font-size: 10.5px;
  }
  .skill-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; flex-shrink: 0; }

  .evo-actions { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .evo-btn {
    flex: 1; min-width: 0; padding: 5px 6px; border: 1px solid #3a5a3a;
    background: transparent; color: #5dba4a; cursor: pointer;
    font: inherit; font-size: 10.5px; text-align: center;
  }
  .evo-btn:hover { background: #122012; }
  .evo-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .evo-btn.secondary { border-color: #2a3a2a; color: #7a8a7a; }

  .evo-log {
    margin-top: 6px; max-height: 72px; overflow-y: auto;
    font-size: 10px; color: #7a8a7a; border-top: 1px solid #141a14; padding-top: 4px;
  }
  .evo-log-item { padding: 2px 0; border-bottom: 1px dashed #141a14; }
  .evo-log-item.ok { color: #5dba4a; }
  .evo-log-item.fail { color: #e07a6a; }

  /* Chat host */
  #chatHost {
    position: fixed; right: 12px; bottom: 12px; z-index: 99999;
    width: min(400px, calc(100vw - 24px)); max-height: min(58vh, 560px);
    display: flex; flex-direction: column;
    background: rgba(6,10,6,.98); border: 1px solid #1a261a;
    color: #c4d0c4; font: 12px/1.45 ui-monospace, Consolas, monospace;
  }
  #chatHost header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border-bottom: 1px solid #1a261a; color: #5dba4a;
    text-transform: uppercase; letter-spacing: .08em; font-size: 11px; cursor: pointer;
  }
  #chatHost.collapsed { max-height: 40px; overflow: hidden; }
  #chatLog { flex: 1; overflow: auto; padding: 10px; min-height: 140px; }
  #chatLog .m { margin-bottom: 8px; padding: 8px 10px; border-radius: 4px; white-space: pre-wrap; font-size: 11.5px; }
  #chatLog .u { background: #122012; border: 1px solid #1e2e1e; margin-left: 12%; }
  #chatLog .b { background: #0a0e0a; border: 1px solid #1a261a; margin-right: 4%; }
  #chatLog .src { margin-top: 6px; color: #5a6a5a; font-size: 10px; }
  #chatLog pre { margin: 6px 0 0; padding: 8px; background: #050805; border: 1px solid #1a261a; overflow:auto; font-size: 10.5px; max-height: 200px; }
  #chatForm { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #1a261a; }
  #chatForm input, #keyRow input {
    flex: 1; background: #060906; border: 1px solid #1a261a; color: #c4d0c4;
    font: inherit; padding: 7px 9px;
  }
  #chatForm button, #keyRow button, #links a {
    border: 1px solid #3a5a3a; color: #5dba4a; background: transparent;
    padding: 6px 10px; cursor: pointer; font: inherit; text-decoration: none;
  }
  #keyRow { display: flex; gap: 6px; padding: 6px 8px; border-top: 1px solid #141a14; }
  #links { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 8px 6px; }
  #chatStatus { padding: 2px 10px 8px; font-size: 10px; color: #5a6a5a; }
  #chatStatus.ok { color: #5dba4a; }
  #chatStatus.warn { color: #c96; }
</style>
</head>
<body>
<iframe id="frame" title="The-fly neural graph" src="brain-core.html" allowfullscreen></iframe>

<!-- HUD intégré, même design que le site, bas-gauche (sous la zone graphe) -->
<aside id="evolution-hud">
  <div class="hud-header" id="hudToggle">
    <span>🪰 Cortex Évolutif</span>
    <span id="hud-test-badge" class="hud-badge badge-idle">IDLE</span>
  </div>
  <div class="hud-body">
    <div class="hud-grid">
      <div class="hud-stat"><b id="stat-gen">G0</b><span>Génération</span></div>
      <div class="hud-stat"><b id="stat-reward">+0.0</b><span>Récompense</span></div>
      <div class="hud-stat"><b id="stat-comp">–</b><span>Composantes</span></div>
    </div>
    <div class="hud-grid">
      <div class="hud-stat"><b id="stat-skills">0</b><span>Skills evo</span></div>
      <div class="hud-stat"><b id="stat-bridges">–</b><span>Ponts</span></div>
      <div class="hud-stat"><b id="stat-orphans">–</b><span>Isolés</span></div>
    </div>

    <div class="hud-section-title">Skills (couleur déterministe)</div>
    <div id="skill-legend"></div>

    <div class="evo-actions">
      <button class="evo-btn" id="btn-run-evolution">⚡ Évoluer + Tester</button>
      <button class="evo-btn secondary" id="btn-rollback">↩ Rollback</button>
    </div>
    <div class="hud-section-title">Journal</div>
    <div id="evo-log" class="evo-log"></div>
  </div>
</aside>

<div id="chatHost">
  <header id="chatToggle">
    <span>🪰 THE-FLY · cortex</span>
    <span id="chatMin">–</span>
  </header>
  <div id="chatLog"></div>
  <div id="keyRow">
    <input id="groqKey" type="password" placeholder="clé cortex gsk_… (optionnel si local)" />
    <button type="button" id="saveKey">OK</button>
  </div>
  <div id="links">
    <a href="fly-skills.html" target="_blank">skills</a>
    <a href="#" id="btnTriage">triage</a>
    <a href="#" id="btnSkill">skill_learn</a>
    <a href="#" id="btnLearn">auto_learn</a>
    <a href="#" id="btnEvo">évolution</a>
  </div>
  <form id="chatForm">
    <input id="chatQ" type="text" placeholder="triage · skill_learn · auto_learn · évolution · question…" autocomplete="off" />
    <button type="submit">→</button>
  </form>
  <div id="chatStatus">init…</div>
</div>

<script>
(function () {
  var RAW = "https://raw.githubusercontent.com/glowku/The-fly/main";
  var API = "https://api.groq.com/openai/v1/chat/completions";
  var MODEL = "openai/gpt-oss-20b";
  var LOCAL = ["http://127.0.0.1:8765", "http://localhost:8765"];
  var logEl = document.getElementById("chatLog");
  var form = document.getElementById("chatForm");
  var input = document.getElementById("chatQ");
  var host = document.getElementById("chatHost");
  var st = document.getElementById("chatStatus");
  var keyInput = document.getElementById("groqKey");
  var apiBase = null;
  var history = [];
  var skillsCache = null;

  function getSkillColor(skillName, indexFallback) {
    var hash = 0;
    for (var i = 0; i < skillName.length; i++) {
      hash = skillName.charCodeAt(i) + ((hash << 5) - hash);
    }
    var hue = Math.abs((hash * 137.508 + (indexFallback || 0) * 47) % 360);
    return "hsl(" + Math.round(hue) + ", 82%, 58%)";
  }

  var FIXED_COLORS = {
    entomologie: "#5dba4a", anatomie_insecte: "#4ac9ba", vol_et_aerodynamique: "#7a9dff",
    ecologie: "#c9ba4a", evolution: "#ba4ac9", comportement: "#ff9d7a",
    code_et_outils: "#38bdf8", representation: "#a78bfa", raisonnement: "#f472b6",
    securite_defensive: "#fbbf24", recherche_web: "#34d399", recherche_image: "#fb7185"
  };

  function skillColor(name, idx) {
    return FIXED_COLORS[name] || getSkillColor(name, idx);
  }

  function evoLog(msg, ok) {
    var el = document.getElementById("evo-log");
    var d = document.createElement("div");
    d.className = "evo-log-item " + (ok === true ? "ok" : ok === false ? "fail" : "");
    d.textContent = new Date().toLocaleTimeString() + " · " + msg;
    el.insertBefore(d, el.firstChild);
  }

  function renderSkillLegend(skillsObj) {
    var legend = document.getElementById("skill-legend");
    legend.innerHTML = "";
    var keys = Object.keys(skillsObj || {});
    if (!keys.length && skillsCache) {
      keys = Object.keys(skillsCache);
      skillsObj = skillsCache;
    }
    document.getElementById("stat-skills").textContent = keys.length;
    keys.slice(0, 14).forEach(function (name, idx) {
      var info = skillsObj[name] || {};
      var color = skillColor(name, idx);
      var level = info.level != null ? Number(info.level).toFixed(1) : (info.reward != null ? info.reward : "–");
      var chip = document.createElement("div");
      chip.className = "skill-chip";
      chip.style.borderLeftColor = color;
      chip.innerHTML =
        '<span><span class="skill-dot" style="background:' + color + '"></span>' +
        name + '</span><span style="color:#7a8a7a">L' + level + '</span>';
      legend.appendChild(chip);
    });
  }

  function renderHud(data) {
    if (!data) return;
    var m = data.metrics || {};
    document.getElementById("stat-gen").textContent = "G" + (data.generation || 0);
    document.getElementById("stat-reward").textContent =
      (data.total_reward >= 0 ? "+" : "") + (Number(data.total_reward) || 0).toFixed(1);
    document.getElementById("stat-comp").textContent = m.connected_components != null ? Math.round(m.connected_components) : "–";
    document.getElementById("stat-bridges").textContent = m.bridges != null ? Math.round(m.bridges) : "–";
    document.getElementById("stat-orphans").textContent = m.orphans != null ? Math.round(m.orphans) : "–";

    var skills = data.skills || {};
    renderSkillLegend(skills);

    var badge = document.getElementById("hud-test-badge");
    var last = (data.history || []).slice(-1)[0];
    if (last) {
      if (last.status === "COMMITTED") {
        badge.textContent = "OK";
        badge.className = "hud-badge badge-pass";
      } else {
        badge.textContent = "ROLLBACK";
        badge.className = "hud-badge badge-rollback";
      }
    } else {
      badge.textContent = "IDLE";
      badge.className = "hud-badge badge-idle";
    }
  }

  async function loadSkillsJson() {
    try {
      var r = await fetch(RAW + "/state/skills.json?t=" + Date.now());
      if (r.ok) {
        skillsCache = await r.json();
        if (skillsCache && Object.keys(skillsCache).length) {
          renderSkillLegend(skillsCache);
        }
      }
    } catch (e) {}
  }

  async function loadEvolutionStatus() {
    try {
      if (!apiBase) await probeLocal();
      if (apiBase) {
        var r = await fetch(apiBase + "/api/evolution/status", { signal: AbortSignal.timeout(2000) });
        if (r.ok) {
          renderHud(await r.json());
          return;
        }
      }
    } catch (e) {}
    // fallback statique GitHub Pages / HTTP
    try {
      var r2 = await fetch(RAW + "/state/evolution_state.json?t=" + Date.now());
      if (r2.ok) renderHud(await r2.json());
    } catch (e2) {}
    if (!skillsCache) await loadSkillsJson();
    else renderSkillLegend({});
  }

  document.getElementById("hudToggle").onclick = function () {
    document.getElementById("evolution-hud").classList.toggle("collapsed");
  };

  document.getElementById("btn-run-evolution").onclick = async function () {
    var btn = this;
    btn.disabled = true;
    evoLog("Évolution en cours…");
    try {
      if (!apiBase) await probeLocal();
      if (!apiBase) throw new Error("Serveur local requis (run_chat_server.py)");
      var r = await fetch(apiBase + "/api/evolution/step", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({})
      });
      var j = await r.json();
      if (!r.ok || j.ok === false) throw new Error(j.error || "HTTP " + r.status);
      var rec = j.record || {};
      evoLog(rec.status + " reward=" + rec.reward + " gen=" + rec.generation, rec.status === "COMMITTED");
      if (j.status) renderHud(j.status);
      else await loadEvolutionStatus();
    } catch (e) {
      evoLog("Erreur: " + e.message, false);
    }
    btn.disabled = false;
  };

  document.getElementById("btn-rollback").onclick = async function () {
    var btn = this;
    btn.disabled = true;
    evoLog("Rollback…");
    try {
      if (!apiBase) await probeLocal();
      if (!apiBase) throw new Error("Serveur local requis");
      var r = await fetch(apiBase + "/api/evolution/rollback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({})
      });
      var j = await r.json();
      evoLog(j.ok ? "Rollback OK → " + (j.checkpoint_id || "?") : "Rollback échoué", !!j.ok);
      if (j.status) renderHud(j.status);
    } catch (e) {
      evoLog("Erreur: " + e.message, false);
    }
    btn.disabled = false;
  };

  document.getElementById("chatToggle").onclick = function (e) {
    if (e.target.id === "chatMin") return;
    host.classList.toggle("collapsed");
  };
  document.getElementById("chatMin").onclick = function (e) {
    e.stopPropagation();
    host.classList.toggle("collapsed");
    e.target.textContent = host.classList.contains("collapsed") ? "+" : "–";
  };
  document.getElementById("saveKey").onclick = function () {
    var k = (keyInput.value || "").trim();
    if (k) localStorage.setItem("THEFLY_GROQ_KEY", k);
    else localStorage.removeItem("THEFLY_GROQ_KEY");
    keyInput.value = "";
    refreshStatus();
    add("bot", k ? "Cortex cloud armé." : "Clé effacée.");
  };
  if (localStorage.getItem("THEFLY_GROQ_KEY")) keyInput.placeholder = "clé cortex en localStorage";

  function add(role, text) {
    var d = document.createElement("div");
    d.className = "m " + (role === "user" ? "u" : "b");
    if (role === "bot" && text.indexOf("```") >= 0) {
      var parts = text.split(/```/);
      d.innerHTML = "";
      parts.forEach(function (p, i) {
        if (i % 2 === 0) d.appendChild(document.createTextNode(p));
        else {
          var pre = document.createElement("pre");
          pre.textContent = p.replace(/^\w*\n/, "");
          d.appendChild(pre);
        }
      });
    } else d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    return d;
  }

  function scrub(t) {
    return (t || "").replace(/\b(GPT-?4|ChatGPT|OpenAI|Groq|Claude)\b/gi, "moteur de langage");
  }

  function skillBoost() {
    return [
      "Booster skills = faire tourner l'organisme :",
      "1. skill_learn → skill_notes/ + levels",
      "2. auto_learn → nouveaux nœuds insecte filtrés",
      "3. triage → TRIE vers quarantine.json (ne supprime pas les wiki)",
      "4. évolution → densify + learn sous tests + rollback auto",
      "5. Avec python run_chat_server.py : boutons AGISSENT",
      "6. Sans serveur local : description seulement (Pages = lecture seule)"
    ].join("\n");
  }

  function detectMode(q) {
    var s = (q || "").toLowerCase().trim();
    if (/^(salut|hello|hi|hey|bonjour|t'es la|tes la|yo)\b/i.test(s)) return "greet";
    if (/(triage|purge|nettoie|trie les)/i.test(s)) return "act_triage";
    if (/^(skill_learn|lance skill|run skill)/i.test(s) || s === "skill_learn") return "act_skill";
    if (/^(auto_learn|apprend|lance learn|run learn)/i.test(s) || /auto_learn/i.test(s) && !/comment/.test(s)) return "act_learn";
    if (/(évolu|evolu|evolution|run evolution)/i.test(s)) return "act_evolution";
    if (/(booster?|améliorer|ameliorer).*(skill|compétence)|comment booster/i.test(s)) return "skill";
    if (/(hack|attaque|exploit|ransomware)/i.test(s)) return "sec";
    if (/(code|coder|html|python|ascii|génère|page html)/i.test(s)) return "code";
    if (/(comment tu|qui es|t'es quel|architecture|myst)/i.test(s)) return "meta";
    if (/(vol|mouche|aile|haltere|insecte|larve|yeux)/i.test(s)) return "insect";
    return "general";
  }

  async function probeLocal() {
    for (var i = 0; i < LOCAL.length; i++) {
      try {
        var r = await fetch(LOCAL[i] + "/health", { signal: AbortSignal.timeout(600) });
        if (r.ok) { apiBase = LOCAL[i]; return true; }
      } catch (e) {}
    }
    apiBase = null;
    return false;
  }

  async function refreshStatus() {
    var local = await probeLocal();
    var key = !!(localStorage.getItem("THEFLY_GROQ_KEY") || "").trim();
    if (local) { st.textContent = "ACTIF · cortex local " + apiBase + " (learn/triage/évolution OK)"; st.className = "ok"; }
    else if (key) { st.textContent = "cloud cortex · pas d'écriture repo sans local"; st.className = "warn"; }
    else { st.textContent = "lecture seule — lance run_chat_server.py pour AGIR"; st.className = "warn"; }
    loadEvolutionStatus();
  }

  async function actLocal(path, body) {
    if (!apiBase) await probeLocal();
    if (!apiBase) throw new Error("Serveur local requis (python run_chat_server.py)");
    var r = await fetch(apiBase + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  }

  async function answer(q) {
    var mode = detectMode(q);

    if (mode === "greet") return { answer: "Là. Avec serveur local: triage / skill_learn / auto_learn / évolution.", sources: [], mode: "greet" };
    if (mode === "skill") return { answer: skillBoost(), sources: [], mode: "skill_arch" };
    if (mode === "meta") return {
      answer: "The-fly = graphe + auto_learn + skill_learn + triage + évolution testée (rollback) + Graph-RAG.",
      sources: [], mode: "meta"
    };

    if (mode === "act_triage" || mode === "act_skill" || mode === "act_learn" || mode === "act_evolution") {
      try {
        if (!apiBase) await probeLocal();
        if (apiBase) {
          var j = await actLocal("/api/chat", { question: q });
          return { answer: scrub(j.answer || JSON.stringify(j.report || j)), sources: j.sources || [], mode: j.mode || mode };
        }
        return {
          answer: "Action « " + mode + " » nécessite le cortex local:\n  python run_chat_server.py\nPuis réessaie.\n(Pages seul = lecture seule.)",
          sources: [], mode: "need_local"
        };
      } catch (e) {
        return { answer: "Échec action: " + e.message, sources: [], mode: "error" };
      }
    }

    if (!apiBase) await probeLocal();
    if (apiBase) {
      var r = await fetch(apiBase + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, use_arxiv: true, k: 5 })
      });
      var j2 = await r.json();
      return { answer: scrub(j2.answer || ""), sources: j2.sources || [], mode: j2.mode || "local" };
    }

    var key = (localStorage.getItem("THEFLY_GROQ_KEY") || "").trim();
    if (!key) return { answer: "Sans serveur local ni clé cortex: modes skill/meta seulement.", sources: [], mode: "locked" };

    var sys = "Tu es THE-FLY agent graphe. Interdit de te dire GPT/Groq. Housefly=labellum pas stylet. Mode=" + mode;
    var messages = [{ role: "system", content: sys }, { role: "user", content: q }];
    var rr = await fetch(API, {
      method: "POST",
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages: messages, temperature: 0.4, max_tokens: 900 })
    });
    if (!rr.ok) throw new Error("cortex HTTP " + rr.status);
    var text = scrub((await rr.json()).choices[0].message.content.trim());
    return { answer: text, sources: [], mode: mode + "+cloud" };
  }

  async function runBtn(cmd) {
    add("user", cmd);
    var p = add("bot", "…");
    try {
      var res = await answer(cmd);
      p.remove();
      var n = add("bot", res.answer);
      var s = document.createElement("div");
      s.className = "src";
      s.textContent = "mode: " + res.mode;
      n.appendChild(s);
      if (res.mode === "act_evolution") loadEvolutionStatus();
    } catch (e) { p.textContent = e.message; }
  }

  document.getElementById("btnTriage").onclick = function (e) { e.preventDefault(); runBtn("triage"); };
  document.getElementById("btnSkill").onclick = function (e) { e.preventDefault(); runBtn("skill_learn"); };
  document.getElementById("btnLearn").onclick = function (e) { e.preventDefault(); runBtn("auto_learn"); };
  document.getElementById("btnEvo").onclick = function (e) { e.preventDefault(); runBtn("évolution"); };

  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var q = (input.value || "").trim();
    if (!q) return;
    input.value = "";
    add("user", q);
    var pending = add("bot", "…");
    try {
      var res = await answer(q);
      pending.remove();
      var node = add("bot", res.answer);
      var s = document.createElement("div");
      s.className = "src";
      s.textContent = (res.sources && res.sources.length ? "nœuds: " + res.sources.join(" · ") + " · " : "") + "mode: " + res.mode;
      node.appendChild(s);
      if (res.mode === "act_evolution") loadEvolutionStatus();
    } catch (e) { pending.textContent = "Erreur: " + e.message; }
  });

  add("bot", "The-fly cortex.\n• Pages / HTTP seul = parle + HUD lecture\n• python run_chat_server.py = AGIT (triage / skill_learn / auto_learn / évolution)\nHUD bas-gauche = récompenses, skills & connexité.");
  loadSkillsJson().then(function(){ refreshStatus(); });
  setInterval(refreshStatus, 12000);
})();
</script>
</body>
</html>
