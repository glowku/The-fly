<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>the-fly · brain</title>
<style>
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #040604; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #040604; }
  #chatHost {
    position: fixed; right: 12px; bottom: 12px; z-index: 99999;
    width: min(420px, calc(100vw - 24px)); max-height: min(62vh, 620px);
    display: flex; flex-direction: column;
    background: rgba(6,10,6,.98); border: 1px solid #1a261a;
    color: #c4d0c4; font: 12px/1.45 ui-monospace, Consolas, monospace;
  }
  #chatHost header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border-bottom: 1px solid #1a261a; color: #5dba4a;
    text-transform: uppercase; letter-spacing: .08em; font-size: 11px; cursor: pointer;
  }
  #chatHost.collapsed { max-height: 40px; overflow: hidden; }
  #chatLog { flex: 1; overflow: auto; padding: 10px; min-height: 160px; }
  #chatLog .m { margin-bottom: 8px; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; font-size: 11.5px; }
  #chatLog .u { background: #122012; border: 1px solid #1e2e1e; margin-left: 12%; }
  #chatLog .b { background: #0a0e0a; border: 1px solid #1a261a; margin-right: 4%; }
  #chatLog .src { margin-top: 6px; color: #5a6a5a; font-size: 10px; }
  #chatLog pre { margin: 6px 0 0; padding: 8px; background: #050805; border: 1px solid #1a261a; overflow:auto; font-size: 10.5px; max-height: 220px; }
  #chatForm { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #1a261a; }
  #chatForm input, #keyRow input {
    flex: 1; background: #060906; border: 1px solid #1a261a; color: #c4d0c4;
    font: inherit; padding: 7px 9px;
  }
  #chatForm button, #keyRow button, #links a {
    border: 1px solid #3a5a3a; color: #5dba4a; background: transparent;
    padding: 6px 10px; cursor: pointer; font: inherit; text-decoration: none;
  }
  #keyRow { display: flex; gap: 6px; padding: 6px 8px; border-top: 1px solid #141a14; }
  #links { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 8px 6px; }
  #chatStatus { padding: 2px 10px 8px; font-size: 10px; color: #5a6a5a; }
  #chatStatus.ok { color: #5dba4a; }
  #chatStatus.warn { color: #c96; }
</style>
</head>
<body>
<iframe id="frame" title="The-fly neural graph" src="brain-core.html" allowfullscreen></iframe>

<div id="chatHost">
  <header id="chatToggle">
    <span>🪰 THE-FLY · cortex</span>
    <span id="chatMin">–</span>
  </header>
  <div id="chatLog"></div>
  <div id="keyRow">
    <input id="groqKey" type="password" placeholder="clé cortex gsk_… (optionnel si local)" />
    <button type="button" id="saveKey">OK</button>
  </div>
  <div id="links">
    <a href="fly-skills.html" target="_blank">skills</a>
    <a href="#" id="btnTriage">triage</a>
    <a href="#" id="btnSkill">skill_learn</a>
    <a href="#" id="btnLearn">auto_learn</a>
  </div>
  <form id="chatForm">
    <input id="chatQ" type="text" placeholder="triage · skill_learn · auto_learn · question…" autocomplete="off" />
    <button type="submit">→</button>
  </form>
  <div id="chatStatus">init…</div>
</div>

<script>
(function () {
  var RAW = "https://raw.githubusercontent.com/glowku/The-fly/main";
  var API = "https://api.groq.com/openai/v1/chat/completions";
  var MODEL = "openai/gpt-oss-20b";
  var LOCAL = ["http://127.0.0.1:8765", "http://localhost:8765"];
  var logEl = document.getElementById("chatLog");
  var form = document.getElementById("chatForm");
  var input = document.getElementById("chatQ");
  var host = document.getElementById("chatHost");
  var st = document.getElementById("chatStatus");
  var keyInput = document.getElementById("groqKey");
  var apiBase = null;
  var history = [];

  document.getElementById("chatToggle").onclick = function (e) {
    if (e.target.id === "chatMin") return;
    host.classList.toggle("collapsed");
  };
  document.getElementById("chatMin").onclick = function (e) {
    e.stopPropagation();
    host.classList.toggle("collapsed");
    e.target.textContent = host.classList.contains("collapsed") ? "+" : "–";
  };
  document.getElementById("saveKey").onclick = function () {
    var k = (keyInput.value || "").trim();
    if (k) localStorage.setItem("THEFLY_GROQ_KEY", k);
    else localStorage.removeItem("THEFLY_GROQ_KEY");
    keyInput.value = "";
    refreshStatus();
    add("bot", k ? "Cortex cloud armé." : "Clé effacée.");
  };
  if (localStorage.getItem("THEFLY_GROQ_KEY")) keyInput.placeholder = "clé cortex en localStorage";

  function add(role, text) {
    var d = document.createElement("div");
    d.className = "m " + (role === "user" ? "u" : "b");
    if (role === "bot" && text.indexOf("```") >= 0) {
      var parts = text.split(/```/);
      d.innerHTML = "";
      parts.forEach(function (p, i) {
        if (i % 2 === 0) d.appendChild(document.createTextNode(p));
        else {
          var pre = document.createElement("pre");
          pre.textContent = p.replace(/^\w*\n/, "");
          d.appendChild(pre);
        }
      });
    } else d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    return d;
  }

  function scrub(t) {
    return (t || "").replace(/\b(GPT-?4|ChatGPT|OpenAI|Groq|Claude)\b/gi, "moteur de langage");
  }

  function skillBoost() {
    return [
      "Booster skills = faire tourner l'organisme :",
      "1. skill_learn → skill_notes/ + levels",
      "2. auto_learn → nouveaux nœuds insecte filtrés",
      "3. triage → TRIE vers quarantine.json (ne supprime pas les wiki)",
      "4. Avec python run_chat_server.py : boutons triage / skill_learn / auto_learn AGISSENT",
      "5. Sans serveur local : description seulement (Pages ne peut pas écrire le repo)"
    ].join("\n");
  }

  function detectMode(q) {
    var s = (q || "").toLowerCase().trim();
    if (/^(salut|hello|hi|hey|bonjour|t'es la|tes la|yo)\b/i.test(s)) return "greet";
    if (/(triage|purge|nettoie|trie les)/i.test(s)) return "act_triage";
    if (/^(skill_learn|lance skill|run skill)/i.test(s) || s === "skill_learn") return "act_skill";
    if (/^(auto_learn|apprend|lance learn|run learn)/i.test(s) || /auto_learn/i.test(s) && !/comment/.test(s)) return "act_learn";
    if (/(booster?|améliorer|ameliorer).*(skill|compétence)|comment booster/i.test(s)) return "skill";
    if (/(hack|attaque|exploit|ransomware)/i.test(s)) return "sec";
    if (/(code|coder|html|python|ascii|génère|page html)/i.test(s)) return "code";
    if (/(comment tu|qui es|t'es quel|architecture|myst)/i.test(s)) return "meta";
    if (/(vol|mouche|aile|haltere|insecte|larve|yeux)/i.test(s)) return "insect";
    return "general";
  }

  async function probeLocal() {
    for (var i = 0; i < LOCAL.length; i++) {
      try {
        var r = await fetch(LOCAL[i] + "/health", { signal: AbortSignal.timeout(600) });
        if (r.ok) { apiBase = LOCAL[i]; return true; }
      } catch (e) {}
    }
    apiBase = null;
    return false;
  }

  async function refreshStatus() {
    var local = await probeLocal();
    var key = !!(localStorage.getItem("THEFLY_GROQ_KEY") || "").trim();
    if (local) { st.textContent = "ACTIF · cortex local " + apiBase + " (learn/triage OK)"; st.className = "ok"; }
    else if (key) { st.textContent = "cloud cortex · pas d'écriture repo sans local"; st.className = "warn"; }
    else { st.textContent = "lecture seule — lance run_chat_server.py pour AGIR"; st.className = "warn"; }
  }

  async function actLocal(path, body) {
    if (!apiBase) await probeLocal();
    if (!apiBase) throw new Error("Serveur local requis (python run_chat_server.py)");
    var r = await fetch(apiBase + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  }

  async function answer(q) {
    var mode = detectMode(q);

    if (mode === "greet") return { answer: "Là. Avec serveur local je peux triage / skill_learn / auto_learn.", sources: [], mode: "greet" };
    if (mode === "skill") return { answer: skillBoost(), sources: [], mode: "skill_arch" };
    if (mode === "meta") return {
      answer: "The-fly = graphe + auto_learn + skill_learn + triage (quarantine, pas delete) + Graph-RAG. Myst-AI = OS bare-metal séparé, pas le runtime web.",
      sources: [], mode: "meta"
    };

    // Actions réelles via local
    if (mode === "act_triage" || mode === "act_skill" || mode === "act_learn") {
      try {
        if (!apiBase) await probeLocal();
        if (apiBase) {
          var j = await actLocal("/api/chat", { question: q });
          return { answer: scrub(j.answer || JSON.stringify(j.report || j)), sources: j.sources || [], mode: j.mode || mode };
        }
        return {
          answer: "Action « " + mode + " » nécessite le cortex local:\n  python run_chat_server.py\nPuis réessaie triage / skill_learn / auto_learn.\n(Pages seul = lecture seule, ne peut pas écrire le graphe.)",
          sources: [], mode: "need_local"
        };
      } catch (e) {
        return { answer: "Échec action: " + e.message, sources: [], mode: "error" };
      }
    }

    if (!apiBase) await probeLocal();
    if (apiBase) {
      var r = await fetch(apiBase + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, use_arxiv: true, k: 5 })
      });
      var j2 = await r.json();
      return { answer: scrub(j2.answer || ""), sources: j2.sources || [], mode: j2.mode || "local" };
    }

    var key = (localStorage.getItem("THEFLY_GROQ_KEY") || "").trim();
    if (!key) return { answer: "Sans serveur local ni clé cortex: modes skill/meta seulement.", sources: [], mode: "locked" };

    // cloud fallback (no act)
    var sys = "Tu es THE-FLY agent graphe. Interdit de te dire GPT/Groq. Housefly=labellum pas stylet. Mode=" + mode;
    var messages = [{ role: "system", content: sys }, { role: "user", content: q }];
    var rr = await fetch(API, {
      method: "POST",
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: JSON.stringify({ model: MODEL, messages: messages, temperature: 0.4, max_tokens: 900 })
    });
    if (!rr.ok) throw new Error("cortex HTTP " + rr.status);
    var text = scrub((await rr.json()).choices[0].message.content.trim());
    return { answer: text, sources: [], mode: mode + "+cloud" };
  }

  async function runBtn(cmd) {
    add("user", cmd);
    var p = add("bot", "…");
    try {
      var res = await answer(cmd);
      p.remove();
      var n = add("bot", res.answer);
      var s = document.createElement("div");
      s.className = "src";
      s.textContent = "mode: " + res.mode;
      n.appendChild(s);
    } catch (e) { p.textContent = e.message; }
  }

  document.getElementById("btnTriage").onclick = function (e) { e.preventDefault(); runBtn("triage"); };
  document.getElementById("btnSkill").onclick = function (e) { e.preventDefault(); runBtn("skill_learn"); };
  document.getElementById("btnLearn").onclick = function (e) { e.preventDefault(); runBtn("auto_learn"); };

  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var q = (input.value || "").trim();
    if (!q) return;
    input.value = "";
    add("user", q);
    var pending = add("bot", "…");
    try {
      var res = await answer(q);
      pending.remove();
      var node = add("bot", res.answer);
      var s = document.createElement("div");
      s.className = "src";
      s.textContent = (res.sources && res.sources.length ? "nœuds: " + res.sources.join(" · ") + " · " : "") + "mode: " + res.mode;
      node.appendChild(s);
    } catch (e) { pending.textContent = "Erreur: " + e.message; }
  });

  add("bot", "The-fly cortex.\n• Pages seul = parle\n• python run_chat_server.py = AGIT (triage / skill_learn / auto_learn)\nBoutons en bas du panneau.");
  refreshStatus();
  setInterval(refreshStatus, 8000);
})();
</script>
</body>
</html>
