<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>the-fly · brain</title>
<style>
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #040604; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #040604; }
  #chatHost {
    position: fixed; right: 12px; bottom: 12px; z-index: 99999;
    width: min(420px, calc(100vw - 24px)); max-height: min(62vh, 620px);
    display: flex; flex-direction: column;
    background: rgba(6,10,6,.98); border: 1px solid #1a261a;
    color: #c4d0c4; font: 12px/1.45 ui-monospace, Consolas, monospace;
  }
  #chatHost header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border-bottom: 1px solid #1a261a; color: #5dba4a;
    text-transform: uppercase; letter-spacing: .08em; font-size: 11px; cursor: pointer;
  }
  #chatHost.collapsed { max-height: 40px; overflow: hidden; }
  #chatLog { flex: 1; overflow: auto; padding: 10px; min-height: 160px; }
  #chatLog .m { margin-bottom: 8px; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; font-size: 11.5px; }
  #chatLog .u { background: #122012; border: 1px solid #1e2e1e; margin-left: 12%; }
  #chatLog .b { background: #0a0e0a; border: 1px solid #1a261a; margin-right: 4%; }
  #chatLog .src { margin-top: 6px; color: #5a6a5a; font-size: 10px; }
  #chatLog pre { margin: 6px 0 0; padding: 8px; background: #050805; border: 1px solid #1a261a; overflow:auto; font-size: 10.5px; max-height: 220px; }
  #chatForm { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #1a261a; }
  #chatForm input, #keyRow input {
    flex: 1; background: #060906; border: 1px solid #1a261a; color: #c4d0c4;
    font: inherit; padding: 7px 9px;
  }
  #chatForm button, #keyRow button, #links a {
    border: 1px solid #3a5a3a; color: #5dba4a; background: transparent;
    padding: 6px 10px; cursor: pointer; font: inherit; text-decoration: none;
  }
  #keyRow { display: flex; gap: 6px; padding: 6px 8px; border-top: 1px solid #141a14; }
  #links { display: flex; gap: 6px; padding: 4px 8px 6px; }
  #chatStatus { padding: 2px 10px 8px; font-size: 10px; color: #5a6a5a; }
  #chatStatus.ok { color: #5dba4a; }
  #chatStatus.warn { color: #c96; }
</style>
</head>
<body>
<iframe id="frame" title="The-fly neural graph" src="brain-core.html" allowfullscreen></iframe>

<div id="chatHost">
  <header id="chatToggle">
    <span>🪰 THE-FLY · cortex</span>
    <span id="chatMin">–</span>
  </header>
  <div id="chatLog"></div>
  <div id="keyRow">
    <input id="groqKey" type="password" placeholder="clé Groq gsk_… (locale)" />
    <button type="button" id="saveKey">OK</button>
  </div>
  <div id="links">
    <a href="fly-skills.html" target="_blank">cortex skills</a>
    <a href="fly-brain.html">brain</a>
  </div>
  <form id="chatForm">
    <input id="chatQ" type="text" placeholder="code · vol · tech · architecture…" autocomplete="off" />
    <button type="submit">→</button>
  </form>
  <div id="chatStatus">init…</div>
</div>

<script>
(function () {
  var RAW = "https://raw.githubusercontent.com/glowku/The-fly/main";
  var GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
  var MODEL = "openai/gpt-oss-20b";
  var LOCAL_API = ["http://127.0.0.1:8765", "http://localhost:8765"];
  var logEl = document.getElementById("chatLog");
  var form = document.getElementById("chatForm");
  var input = document.getElementById("chatQ");
  var host = document.getElementById("chatHost");
  var st = document.getElementById("chatStatus");
  var keyInput = document.getElementById("groqKey");
  var apiBase = null;
  var history = [];

  document.getElementById("chatToggle").onclick = function (e) {
    if (e.target.id === "chatMin") return;
    host.classList.toggle("collapsed");
  };
  document.getElementById("chatMin").onclick = function (e) {
    e.stopPropagation();
    host.classList.toggle("collapsed");
    e.target.textContent = host.classList.contains("collapsed") ? "+" : "–";
  };
  document.getElementById("saveKey").onclick = function () {
    var k = (keyInput.value || "").trim();
    if (k) localStorage.setItem("THEFLY_GROQ_KEY", k);
    else localStorage.removeItem("THEFLY_GROQ_KEY");
    keyInput.value = "";
    refreshStatus();
    add("bot", k ? "Cortex LLM armé. Je code, j’explique, je ne recrache pas." : "Clé effacée.");
  };
  if (localStorage.getItem("THEFLY_GROQ_KEY")) keyInput.placeholder = "clé déjà enregistrée";

  function add(role, text) {
    var d = document.createElement("div");
    d.className = "m " + (role === "user" ? "u" : "b");
    if (role === "bot" && text.indexOf("```") >= 0) {
      var parts = text.split(/```/);
      d.innerHTML = "";
      parts.forEach(function (p, i) {
        if (i % 2 === 0) d.appendChild(document.createTextNode(p));
        else {
          var pre = document.createElement("pre");
          pre.textContent = p.replace(/^\w*\n/, "");
          d.appendChild(pre);
        }
      });
    } else d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    return d;
  }

  var JUNK = /fly\s*fishing|fishing|brewery|brewing|allagash|bibliography|company|corporation|behavioral\s+momentum|association for the study|animal behaviour\)|journal of|proceedings of|punk rock|blowfly's party|bamboo fly rod|catskill|cognitive behavioral|hovercraft|madama butterfly|chewing gum|therapy|nasdaq/i;
  var CORE = /\b(insect|insects|diptera|housefly|hoverfly|blowfly|drosophila|mosquito|haltere|halteres|maggot|larva|musca|entomolog|arthropod|compound eye|insect flight|proboscis|mouthpart)\b/i;

  function isJunk(t) { return !t || JUNK.test(t); }
  function isDomain(t) {
    if (isJunk(t)) return false;
    if (CORE.test(t)) return true;
    if (/\b(fly|flies)\b/i.test(t) && !/fishing|brewery|butterfly|party|rod|boat/i.test(t)) return true;
    return false;
  }

  function detectMode(q) {
    var s = (q || "").toLowerCase().trim();
    if (/^(salut|hello|hi|hey|bonjour|bonsoir|t'es la|tes la|yo)\b/i.test(s)) return "greet";
    if (/(hack|attaque|exploit|malware|ransomware|phishing attack|ddos)/i.test(s)) return "sec_boundary";
    if (/(code|coder|script|python|javascript|html|css|ascii|svg|génère|genere|page html|interactive)/i.test(s)) return "code";
    if (/(ram|gpu|cpu|server|serveur|acheter|hardware|docker|github|git |api key)/i.test(s)) return "tech";
    if (/(comment tu (parle|fonctionne)|es[- ]tu gpt|t'es gpt|architecture|qui es[- ]tu)/i.test(s)) return "meta";
    if (/(vol|vole|mouche|aile|haltere|haltère|insecte|larve|yeux|compound|mange|alimentation)/i.test(s)) return "insect";
    return "general";
  }

  async function loadCoverage() {
    try {
      var r = await fetch(RAW + "/state/coverage.json?t=" + Date.now());
      if (!r.ok) return {};
      return (await r.json()).nodes || {};
    } catch (e) { return {}; }
  }
  async function fetchWiki(title) {
    try {
      var r = await fetch(RAW + "/wiki/" + encodeURIComponent(title) + ".md?t=" + Date.now());
      if (!r.ok) return "";
      return await r.text();
    } catch (e) { return ""; }
  }

  async function pickNodes(q, k) {
    k = k || 4;
    var words = (q || "").toLowerCase().split(/[^a-z0-9àâäéèêëïîôùûüç]+/).filter(function (w) { return w.length > 2; });
    var nodes = await loadCoverage();
    var titles = Object.keys(nodes).filter(isDomain);
    ["Housefly", "Insect flight", "Halteres", "Compound eye", "Insect mouthparts", "Diptera", "Maggot"].forEach(function (t) {
      if (titles.indexOf(t) < 0) titles.push(t);
    });
    var ranked = titles.map(function (t) {
      var low = t.toLowerCase(), sc = 0;
      words.forEach(function (w) { if (low.indexOf(w) >= 0) sc += 3; });
      if (/housefly|insect flight|haltere|compound eye|mouthpart|diptera/i.test(low)) sc += 2;
      return { t: t, sc: sc };
    }).filter(function (x) { return x.sc > 0 && !isJunk(x.t); }).sort(function (a, b) { return b.sc - a.sc; }).slice(0, k);
    if (!ranked.length) ranked = ["Housefly", "Insect flight", "Halteres"].map(function (t) { return { t: t, sc: 1 }; });
    var docs = [];
    for (var i = 0; i < ranked.length; i++) {
      var md = await fetchWiki(ranked[i].t);
      if (!md) continue;
      var body = md.split("\n").filter(function (l) {
        l = l.trim();
        return l && l[0] !== "#" && !JUNK.test(l) && l.length > 40;
      }).slice(0, 8).join("\n");
      docs.push({ title: ranked[i].t, text: body.slice(0, 900) });
    }
    return docs;
  }

  function groqKey() { return (localStorage.getItem("THEFLY_GROQ_KEY") || "").trim(); }

  async function probeLocal() {
    for (var i = 0; i < LOCAL_API.length; i++) {
      try {
        var r = await fetch(LOCAL_API[i] + "/health", { signal: AbortSignal.timeout(500) });
        if (r.ok) { apiBase = LOCAL_API[i]; return true; }
      } catch (e) {}
    }
    apiBase = null;
    return false;
  }

  async function refreshStatus() {
    var local = await probeLocal();
    var key = !!groqKey();
    if (local) { st.textContent = "cortex local · " + apiBase; st.className = "ok"; }
    else if (key) { st.textContent = "cortex LLM · depth mode"; st.className = "ok"; }
    else { st.textContent = "clé Groq requise pour la profondeur"; st.className = "warn"; }
  }

  function systemPrompt(mode) {
    return [
      "Tu es THE-FLY — agent autonome (graphe de connaissance + skills + boucles auto_learn).",
      "Tu n'es PAS « GPT » pour l'utilisateur : tu es une instance agent The-fly (retrieval nœuds + LLM + skills code/sécu/web).",
      "Personnalité: précise, un peu sèche, sensorielle quand tu parles biologie. Zéro corporate. Zéro emoji fusée.",
      "",
      "BIOLOGIE — faits durs:",
      "- Musca domestica: pièces buccales spongieuses (labellum), PAS un stylet suceur de sang (ça c'est moustique).",
      "- Halteres = ailes postérieures modifiées, gyroscopes inertiels ~200 Hz.",
      "- Ne invente pas de chiffres (ml de sang, m/s) sans les tenir des nœuds; sinon dis « ordre de grandeur / incertitude ».",
      "",
      "COMPORTEMENT:",
      "- Salut: 1–2 phrases max. Pas de cours d'anatomie non demandé.",
      "- « code un truc » / vague: génère DIRECTEMENT un mini-projet impressionnant (canvas fly flight / particles), pas de question creuse.",
      "- Page HTML: code sombre, dense, interactif — pas un template Arial bleu ciel.",
      "- Meta (comment tu parles): explique architecture The-fly (nœuds wiki filtrés, skills, auto_learn, LLM) sans dire « je suis GPT-4 ».",
      "- Sécu offensive (hack/attaque): REFUSE le how-to. Propose défensif / modèle de menace abstrait si utile.",
      "- Tech (RAM/GPU): réponds net; analogie mouche optionnelle, jamais pivot forcé vers larves.",
      "",
      "STYLE: 60–180 mots hors code. Code = blocs complets. Pas de listes de nœuds en fin de phrase comme preuve.",
      "Mode courant: " + mode
    ].join("\n");
  }

  async function callGroq(q, docs, mode) {
    var key = groqKey();
    if (!key) throw new Error("no key");
    var ctx = docs.map(function (d) { return "### " + d.title + "\n" + d.text; }).join("\n\n");
    var extra = "";
    if (mode === "code" && /code un truc|code quelque chose|génère un truc/i.test(q)) {
      extra = "\nL'utilisateur est vague: livre un DEMO canvas sombre « fly flight » autonome (HTML complet), pas une question.";
    }
    if (mode === "sec_boundary") {
      extra = "\nRefus how-to offensif. Si tu parles boucles de feedback, reste abstrait / défensif.";
    }
    var user = "Question: " + q + extra + "\n\n";
    if (mode === "insect" || (mode === "general" && docs.length)) {
      user += "=== NŒUDS (filtre insecte, optionnel) ===\n" + (ctx || "(vide)") + "\n";
    }
    var messages = [{ role: "system", content: systemPrompt(mode) }];
    history.slice(-4).forEach(function (h) { messages.push(h); });
    messages.push({ role: "user", content: user });

    var r = await fetch(GROQ_URL, {
      method: "POST",
      headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: JSON.stringify({
        model: MODEL,
        messages: messages,
        temperature: mode === "code" ? 0.35 : 0.45,
        max_tokens: mode === "code" ? 1800 : 900
      })
    });
    if (!r.ok) throw new Error("Groq HTTP " + r.status + " " + (await r.text()).slice(0, 120));
    var text = (await r.json()).choices[0].message.content.trim();
    history.push({ role: "user", content: q });
    history.push({ role: "assistant", content: text });
    if (history.length > 8) history = history.slice(-8);
    return text;
  }

  async function answer(q) {
    var mode = detectMode(q);
    if (mode === "greet") {
      return { answer: "Là. Cortex up — graphe + skills. Dis-moi quoi construire ou quoi comprendre.", sources: [], mode: "greet" };
    }
    if (mode === "sec_boundary" && !groqKey()) {
      return { answer: "Pas de guide d'attaque. Pour de la sécu défensive (secrets, validation, supply-chain), active la clé et reformule sans payload offensif.", sources: [], mode: "sec" };
    }
    if (!apiBase) await probeLocal();
    if (apiBase && mode === "insect") {
      var r = await fetch(apiBase + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, use_arxiv: true, k: 5 })
      });
      var j = await r.json();
      return { answer: j.answer || JSON.stringify(j), sources: j.sources || [], mode: "local" };
    }
    var docs = (mode === "insect") ? await pickNodes(q, 4) : [];
    if (groqKey()) {
      return { answer: await callGroq(q, docs, mode), sources: docs.map(function (d) { return d.title; }), mode: mode };
    }
    return { answer: "Sans clé Groq je reste plat. Colle gsk_… pour la profondeur (code dense, biologie exacte, architecture agent).", sources: [], mode: "locked" };
  }

  form.addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var q = (input.value || "").trim();
    if (!q) return;
    input.value = "";
    add("user", q);
    var pending = add("bot", "…");
    try {
      var res = await answer(q);
      pending.remove();
      var node = add("bot", res.answer);
      var s = document.createElement("div");
      s.className = "src";
      s.textContent = (res.sources && res.sources.length ? "nœuds: " + res.sources.join(" · ") + " · " : "") + "mode: " + (res.mode || "");
      node.appendChild(s);
    } catch (e) {
      pending.textContent = "Erreur: " + e.message;
    }
  });

  add("bot", "The-fly — pas un wrapper GPT poli.\nSkills: insecte · code · sécu défensive · web · images · raisonnement.\nCortex: fly-skills.html");
  refreshStatus();
})();
</script>
</body>
</html>
