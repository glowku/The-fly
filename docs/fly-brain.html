<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the-fly · brain</title>
<style>
  :root {
    --bg: #050505;
    --panel: rgba(12,12,12,0.92);
    --line: #1c1c1c;
    --text: #c8c8c8;
    --mute: #555;
    --g: #5dba4a;
    --g2: #8dff6a;
    --dimg: rgba(93,186,74,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 12px/1.45 ui-monospace, "SF Mono", Consolas, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas#brain { width: 100%; height: 100%; display: block; }

  .hud {
    position: fixed; z-index: 10; pointer-events: none;
    inset: 0;
    display: grid;
    grid-template-columns: 240px 1fr 280px;
    grid-template-rows: auto 1fr auto;
    gap: 0;
  }
  .hud > * { pointer-events: auto; }

  .top {
    grid-column: 1 / -1;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(0,0,0,0.85), transparent);
    border-bottom: 1px solid var(--line);
  }
  .top .brand { color: var(--g); letter-spacing: 0.12em; font-size: 11px; text-transform: uppercase; }
  .top .meta { display: flex; gap: 14px; color: var(--mute); align-items: center; flex-wrap: wrap; }
  .top .meta b { color: var(--text); font-weight: 500; }
  .top button {
    pointer-events: auto;
    background: transparent; border: 1px solid var(--line); color: var(--mute);
    font: inherit; padding: 3px 8px; cursor: pointer;
  }
  .top button:hover { border-color: var(--g); color: var(--g); }

  .side {
    margin: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 12px;
    max-height: calc(100vh - 120px);
    overflow: auto;
    backdrop-filter: blur(6px);
  }
  .side h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--mute); margin-bottom: 10px; font-weight: 500;
  }
  .side.left { grid-column: 1; grid-row: 2; align-self: start; }
  .side.right { grid-column: 3; grid-row: 2; align-self: start; }

  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .stat { border: 1px solid var(--line); padding: 8px; background: rgba(0,0,0,0.3); }
  .stat .k { color: var(--mute); font-size: 10px; }
  .stat .v { font-size: 16px; color: var(--g); margin-top: 2px; }

  .skill { margin-bottom: 8px; }
  .skill .r { display: flex; justify-content: space-between; color: var(--mute); margin-bottom: 2px; }
  .skill .r span:last-child { color: var(--text); }
  .bar { height: 2px; background: #1a1a1a; }
  .bar i { display: block; height: 100%; background: var(--g); transition: width 0.5s; }

  .list .item {
    display: flex; justify-content: space-between; gap: 8px;
    padding: 6px 0; border-bottom: 1px solid #151515; cursor: pointer; color: var(--text);
  }
  .list .item:hover { color: var(--g2); }
  .list .sc { color: var(--g); flex-shrink: 0; }

  .feed .row { padding: 4px 0; border-bottom: 1px solid #151515; color: var(--mute); font-size: 11px; }
  .feed .t { color: #a67; margin-right: 6px; }
  .feed .n { color: var(--text); }

  .bottom {
    grid-column: 1 / -1;
    padding: 8px 16px;
    color: var(--mute);
    font-size: 11px;
    border-top: 1px solid var(--line);
    background: rgba(0,0,0,0.7);
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82);
    display: none; align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #0c0c0c; border: 1px solid var(--line);
    width: min(640px, 100%); max-height: 80vh;
    display: flex; flex-direction: column;
  }
  .modal-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .modal-h h3 { color: var(--g); font-size: 12px; font-weight: 500; }
  .modal-h button { background: none; border: none; color: var(--mute); font-size: 18px; cursor: pointer; }
  .modal-b { padding: 14px; overflow: auto; font-size: 12px; line-height: 1.65; }
  .modal-b h1 { font-size: 14px; margin-bottom: 10px; color: var(--text); }
  .modal-b h2 { font-size: 11px; color: var(--g); margin: 14px 0 6px; text-transform: none; letter-spacing: 0; }
  .modal-b a { color: #6af; cursor: pointer; }
  .empty { color: var(--mute); padding: 8px 0; }

  @media (max-width: 800px) {
    .hud { grid-template-columns: 1fr; }
    .side.left, .side.right { max-height: 30vh; }
  }
</style>
</head>
<body>
<canvas id="brain"></canvas>

<div class="hud">
  <div class="top">
    <div class="brand">the-fly · neural graph</div>
    <div class="meta">
      <span>status <b id="st">…</b></span>
      <span>nodes <b id="nn">—</b></span>
      <span>obj <b id="ob">—</b></span>
      <span>avg <b id="aq">—</b></span>
      <button type="button" id="btnRefresh">refresh</button>
    </div>
  </div>

  <div class="side left">
    <h2>metrics</h2>
    <div class="stat-row">
      <div class="stat"><div class="k">concepts</div><div class="v" id="m1">—</div></div>
      <div class="stat"><div class="k">frontier</div><div class="v" id="m2">—</div></div>
      <div class="stat"><div class="k">edges</div><div class="v" id="m3">—</div></div>
      <div class="stat"><div class="k">quality</div><div class="v" id="m4">—</div></div>
    </div>
    <h2>skills</h2>
    <div id="skills"><div class="empty">—</div></div>
  </div>

  <div class="side right">
    <h2>articles</h2>
    <div class="list" id="arts"><div class="empty">—</div></div>
    <h2 style="margin-top:14px">activity</h2>
    <div class="feed" id="feed"><div class="empty">—</div></div>
  </div>

  <div class="bottom" id="log">ready · fetching live json from repo</div>
</div>

<div class="overlay" id="ov">
  <div class="modal">
    <div class="modal-h"><h3 id="mt">—</h3><button type="button" id="btnClose">×</button></div>
    <div class="modal-b" id="mb">…</div>
  </div>
</div>

<script>
const RAW = "https://raw.githubusercontent.com/glowku/The-fly/main";
const canvas = document.getElementById("brain");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, nodes = [], pulses = [], articles = [], skillsData = {};
let hover = null, raf = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", () => { resize(); layout(); });
resize();

function log(m) {
  document.getElementById("log").textContent = m;
}

async function getJSON(p) {
  const r = await fetch(RAW + "/" + p + "?t=" + Date.now());
  if (!r.ok) throw new Error(p + " " + r.status);
  return r.json();
}
async function getText(p) {
  const r = await fetch(RAW + "/" + p + "?t=" + Date.now());
  if (!r.ok) throw new Error(p + " " + r.status);
  return r.text();
}

function layout() {
  const names = Object.keys(skillsData);
  const cx = W * 0.5, cy = H * 0.5;
  nodes = [];

  // core
  nodes.push({ id: "core", x: cx, y: cy, r: 10, kind: "core", label: "CORE", level: 10 });

  // skill ring
  names.forEach((name, i) => {
    const a = (i / Math.max(names.length, 1)) * Math.PI * 2 - Math.PI / 2;
    const d = Math.min(W, H) * 0.18;
    const lv = skillsData[name].level || 0;
    nodes.push({
      id: name, x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d,
      r: 5 + Math.min(8, lv * 0.7), kind: "skill", label: name, level: lv,
      phase: Math.random() * Math.PI * 2
    });
  });

  // article nodes (outer ring / cloud)
  const arts = articles.slice(0, 24);
  arts.forEach((a, i) => {
    const a0 = (i / Math.max(arts.length, 1)) * Math.PI * 2;
    const d = Math.min(W, H) * (0.28 + (i % 5) * 0.03);
    nodes.push({
      id: "a:" + a.title, x: cx + Math.cos(a0) * d, y: cy + Math.sin(a0) * d,
      r: 2.5 + (a.score || 0) * 0.25, kind: "article", label: a.title, level: a.score || 0,
      phase: Math.random() * Math.PI * 2, title: a.title
    });
  });
}

function spawnPulse(from, to) {
  pulses.push({ from, to, t: 0, speed: 0.008 + Math.random() * 0.012 });
}

function draw() {
  ctx.fillStyle = "rgba(5,5,5,0.22)";
  ctx.fillRect(0, 0, W, H);

  const t = performance.now() * 0.001;

  // soft vignette grid
  ctx.strokeStyle = "rgba(93,186,74,0.03)";
  ctx.lineWidth = 1;
  const step = 48;
  for (let x = 0; x < W; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // edges: skills ↔ core
  const core = nodes.find(n => n.kind === "core");
  const skills = nodes.filter(n => n.kind === "skill");
  const arts = nodes.filter(n => n.kind === "article");

  function edge(a, b, alpha, width) {
    const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    g.addColorStop(0, "rgba(93,186,74," + alpha + ")");
    g.addColorStop(0.5, "rgba(141,255,106," + (alpha * 0.9) + ")");
    g.addColorStop(1, "rgba(93,186,74," + alpha + ")");
    ctx.beginPath();
    ctx.strokeStyle = g;
    ctx.lineWidth = width;
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }

  if (core) {
    skills.forEach(s => {
      const pulse = 0.25 + 0.15 * Math.sin(t * 2 + s.phase);
      edge(core, s, pulse, 1.2);
      if (Math.random() < 0.02) spawnPulse(core, s);
    });
  }

  // skill–skill neighbors
  for (let i = 0; i < skills.length; i++) {
    const a = skills[i], b = skills[(i + 1) % skills.length];
    edge(a, b, 0.12, 0.8);
  }

  // articles linked to nearest skill
  arts.forEach(a => {
    let best = null, bestD = Infinity;
    skills.forEach(s => {
      const d = Math.hypot(s.x - a.x, s.y - a.y);
      if (d < bestD) { bestD = d; best = s; }
    });
    if (best) {
      edge(best, a, 0.08 + (a.level / 10) * 0.1, 0.6);
      if (Math.random() < 0.008) spawnPulse(best, a);
    }
  });

  // traveling pulses on synapses
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.t += p.speed;
    if (p.t >= 1) { pulses.splice(i, 1); continue; }
    const x = p.from.x + (p.to.x - p.from.x) * p.t;
    const y = p.from.y + (p.to.y - p.from.y) * p.t;
    const grd = ctx.createRadialGradient(x, y, 0, x, y, 10);
    grd.addColorStop(0, "rgba(200,255,180,0.95)");
    grd.addColorStop(0.4, "rgba(93,186,74,0.5)");
    grd.addColorStop(1, "transparent");
    ctx.beginPath();
    ctx.fillStyle = grd;
    ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.fillStyle = "#e8ffe0";
    ctx.arc(x, y, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }

  // nodes
  nodes.forEach(n => {
    const glow = n.kind === "core" ? 18 : n.kind === "skill" ? 10 + n.level : 4;
    const grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r + glow);
    if (n.kind === "core") {
      grd.addColorStop(0, "rgba(230,255,220,0.95)");
      grd.addColorStop(0.3, "rgba(93,186,74,0.5)");
      grd.addColorStop(1, "transparent");
    } else if (n.kind === "skill") {
      grd.addColorStop(0, "rgba(141,255,106,0.7)");
      grd.addColorStop(0.4, "rgba(93,186,74,0.25)");
      grd.addColorStop(1, "transparent");
    } else {
      grd.addColorStop(0, "rgba(93,186,74,0.35)");
      grd.addColorStop(1, "transparent");
    }
    ctx.beginPath();
    ctx.fillStyle = grd;
    ctx.arc(n.x, n.y, n.r + glow, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = n.kind === "core" ? "#f0fff0" : n.kind === "skill" ? "#5dba4a" : "#3a6a32";
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fill();

    if (n.kind !== "article" || (hover && hover.id === n.id)) {
      ctx.fillStyle = n.kind === "article" ? "#8dff6a" : "#888";
      ctx.font = n.kind === "core" ? "11px monospace" : "10px monospace";
      ctx.textAlign = "center";
      ctx.fillText(n.label.length > 14 ? n.label.slice(0, 12) + "…" : n.label, n.x, n.y + n.r + 12);
    }
  });

  // hover ring
  if (hover) {
    ctx.beginPath();
    ctx.strokeStyle = "rgba(141,255,106,0.6)";
    ctx.lineWidth = 1;
    ctx.arc(hover.x, hover.y, hover.r + 6, 0, Math.PI * 2);
    ctx.stroke();
  }

  raf = requestAnimationFrame(draw);
}

canvas.addEventListener("mousemove", e => {
  const x = e.clientX, y = e.clientY;
  hover = null;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (Math.hypot(n.x - x, n.y - y) < n.r + 8) { hover = n; break; }
  }
  canvas.style.cursor = hover && hover.kind === "article" ? "pointer" : "default";
});
canvas.addEventListener("click", () => {
  if (hover && hover.kind === "article" && hover.title) openArt(hover.title);
});

function renderSkills(sk) {
  const el = document.getElementById("skills");
  if (!sk || !Object.keys(sk).length) { el.innerHTML = '<div class="empty">—</div>'; return; }
  el.innerHTML = Object.entries(sk).sort((a,b) => (b[1].level||0)-(a[1].level||0)).map(([n, info]) => {
    const lv = info.level || 0;
    return '<div class="skill"><div class="r"><span>'+n+'</span><span>'+lv.toFixed(1)+'</span></div><div class="bar"><i style="width:'+Math.min(100,lv*10)+'%"></i></div></div>';
  }).join("");
}

function renderArts(q) {
  const el = document.getElementById("arts");
  articles = Object.entries(q || {}).map(([title, info]) => ({ title, score: info.score || 0 }))
    .sort((a,b) => b.score - a.score);
  if (!articles.length) { el.innerHTML = '<div class="empty">empty</div>'; return; }
  el.innerHTML = articles.slice(0, 18).map(a =>
    '<div class="item" data-t="'+a.title.replace(/"/g,'&quot;')+'"><span>'+a.title+'</span><span class="sc">'+a.score.toFixed(1)+'</span></div>'
  ).join("");
  el.querySelectorAll(".item").forEach(n => n.addEventListener("click", () => openArt(n.getAttribute("data-t"))));
}

function renderFeed(hist) {
  const el = document.getElementById("feed");
  const items = (hist || []).slice(-20).reverse();
  if (!items.length) { el.innerHTML = '<div class="empty">—</div>'; return; }
  el.innerHTML = items.map(h => {
    const ts = (h.ts || "").slice(11, 19);
    return '<div class="row"><span class="t">'+(h.type||"")+'</span><span class="n">'+(h.title||h.skill||"")+(h.score!=null?" "+h.score:"")+'</span> '+ts+"</div>";
  }).join("");
}

function md(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/^# (.+)$/gm,"<h1>$1</h1>").replace(/^## (.+)$/gm,"<h2>$1</h2>")
    .replace(/\[\[([^\]]+)\]\]/g,'<a data-l="$1">$1</a>')
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\n\n/g,"</p><p>").replace(/\n/g,"<br>");
}

async function openArt(title) {
  document.getElementById("mt").textContent = title;
  document.getElementById("mb").textContent = "loading…";
  document.getElementById("ov").classList.add("open");
  try {
    const text = await getText("wiki/" + encodeURIComponent(title) + ".md");
    const box = document.getElementById("mb");
    box.innerHTML = "<p>" + md(text) + "</p>";
    box.querySelectorAll("a[data-l]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); openArt(a.getAttribute("data-l")); }));
  } catch (e) {
    document.getElementById("mb").innerHTML = "<p style='color:#a67'>"+e.message+"</p>";
  }
}
function closeM() { document.getElementById("ov").classList.remove("open"); }

async function loadAll() {
  document.getElementById("st").textContent = "sync";
  log("fetching json…");
  try {
    const [cov, qual, skills] = await Promise.all([
      getJSON("state/coverage.json"),
      getJSON("state/quality.json"),
      getJSON("state/skills.json").catch(() => null)
    ]);
    let hist = [];
    try {
      const t = await getText("state/history.jsonl");
      hist = t.trim().split("\n").filter(Boolean).map(l => JSON.parse(l));
    } catch (_) {}

    const nNodes = Object.keys(cov.nodes || {}).length;
    const nEdges = (cov.edges || []).length;
    const nFront = (cov.frontier || []).length;
    const scores = Object.values(qual || {}).map(x => x.score || 0);
    const avg = scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : 0;
    const obj = Math.min(nNodes/50, 4) * avg;

    document.getElementById("nn").textContent = nNodes;
    document.getElementById("ob").textContent = obj.toFixed(2);
    document.getElementById("aq").textContent = avg.toFixed(1);
    document.getElementById("m1").textContent = nNodes;
    document.getElementById("m2").textContent = nFront;
    document.getElementById("m3").textContent = nEdges;
    document.getElementById("m4").textContent = avg.toFixed(1);

    skillsData = skills || {
      entomologie:{level:1}, anatomie_insecte:{level:0.5}, vol_et_aerodynamique:{level:0.3},
      ecologie:{level:0.4}, evolution:{level:0.2}, comportement:{level:0.3}
    };
    renderSkills(skillsData);
    renderArts(qual);
    renderFeed(hist);
    layout();
    document.getElementById("st").textContent = "online";
    log("online · " + nNodes + " concepts · graph live");
  } catch (e) {
    document.getElementById("st").textContent = "error";
    log(String(e.message || e));
  }
}

document.getElementById("btnRefresh").onclick = loadAll;
document.getElementById("btnClose").onclick = closeM;
document.getElementById("ov").onclick = e => { if (e.target.id === "ov") closeM(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeM(); });

loadAll();
setInterval(loadAll, 45000);
cancelAnimationFrame(raf);
draw();
</script>
</body>
</html>
