name: auto_learn_loop

on:
  schedule:
    # Toutes les 2 heures (laisse le temps au job précédent de finir)
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-learn-loop
  cancel-in-progress: true

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 50          # un peu plus que MAX_RUNTIME
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "fly-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run auto-learn loop (15s × 45 min)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run_auto_loop.py

      - name: Final safety push
        run: |
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "auto_learn_loop: final safety" || true
          fi
          git fetch origin main
          git pull --rebase origin main || {
            git rebase --abort || true
            git pull origin main --no-rebase --no-edit || true
          }
          git push origin HEAD:main || true
