name: auto_learn_loop

# Alias historique → délègue au cortex unifié
on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: the-fly-cortex
  cancel-in-progress: true

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "fly-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cortex loop
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run_cortex.py --mode loop --cycles 10 --interval 60 --max-minutes 45

      - name: Safety push
        run: |
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "auto_learn_loop: safety" || true
          fi
          git fetch origin main
          git pull --rebase origin main || {
            git rebase --abort || true
            git pull origin main --no-rebase --no-edit || true
          }
          git push origin HEAD:main || true
