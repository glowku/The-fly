name: auto_learn

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full (défaut) | triage | skill | wiki"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - triage
          - skill
          - wiki

permissions:
  contents: write

concurrency:
  group: the-fly-cortex-short
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "fly-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cortex one-shot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=full; fi
          python run_cortex.py --mode "$MODE"

      - name: Commit and push
        run: |
          set -e
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "auto_learn: ${{ github.event.inputs.mode || 'full' }}"
          git fetch origin main
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git pull origin main --no-rebase --no-edit || true
          fi
          git push origin HEAD:main
