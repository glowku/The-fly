name: expand

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expand
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "fly-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run agent cycle
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run.py

      - name: Update dashboard
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m agent.evaluate_dashboard

      - name: Commit & push dashboard + state
        run: |
          git add DASHBOARD.md state/ wiki/ || true
          git commit -m "dashboard: auto-update after expand" || echo "Nothing to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "Push failed (non-blocking)"
