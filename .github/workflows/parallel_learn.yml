name: parallel_learn

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parallel-learn
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "fly-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Parallel learn (fallback cortex if import fails)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          python -c "from agent.auto_learn import _candidates_from_frontier; print('import ok')"
          if [ $? -ne 0 ]; then
            echo "parallel imports broken → cortex full"
            python run_cortex.py --mode full --cycles 1
            exit 0
          fi
          python run_parallel_learn.py
          code=$?
          if [ $code -ne 0 ]; then
            echo "parallel failed ($code) → skill+wiki fallback"
            python run_cortex.py --mode skill --cycles 1 || true
            python run_cortex.py --mode wiki --cycles 1 || true
          fi
          exit 0

      - name: Safety commit + push
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "parallel_learn: safety" || true
          fi
          git fetch origin main
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git pull origin main --no-rebase --no-edit || true
          fi
          git push origin HEAD:main || true
