name: bootstrap

on:
  workflow_dispatch:
    inputs:
      root_topic:
        description: "Sujet racine Wikipedia (ex: Fly)"
        required: false
        default: "Fly"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "fly-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set root topic
        run: |
          TOPIC="${{ github.event.inputs.root_topic || 'Fly' }}"
          echo "$TOPIC" > ROOT.txt
          echo "Root=$TOPIC"
          python -c "
from agent.memory import save_coverage, log_event
save_coverage({'root': open('ROOT.txt').read().strip(), 'nodes': {}, 'edges': [], 'frontier': [], 'max_depth': 0})
log_event('reset_root', {'root': open('ROOT.txt').read().strip()})
print('graph reset for', open('ROOT.txt').read().strip())
"
      - name: First expand
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run.py || true
      - name: Dashboard
        run: python -m agent.evaluate_dashboard || true


      - name: Commit and push
        run: |
          set -e
          git add -A
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "bootstrap: init knowledge graph"
          git fetch origin main
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            git pull origin main --no-rebase --no-edit || true
          fi
          git push origin HEAD:main
