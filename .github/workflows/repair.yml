name: repair

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "fly-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Repair pass
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -c "
          from agent.repair import full_repair_pass
          result = full_repair_pass(max_repairs=5)
          print(result)
          "

      - name: Update dashboard
        run: python -m agent.evaluate_dashboard

      - name: Commit repairs
        run: |
          git add wiki/ state/ DASHBOARD.md || true
          git commit -m "repair: auto-correction pass" || echo "Nothing to commit"
          git pull --rebase origin main || true
          git push origin HEAD:main || echo "Push failed"
