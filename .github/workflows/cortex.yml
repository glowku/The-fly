name: cortex

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "triage | skill | skill_loop | wiki | full | loop"
        required: true
        default: "full"
        type: choice
        options:
          - triage
          - skill
          - skill_loop
          - wiki
          - full
          - loop
      cycles:
        description: "Cycles (skill_loop / loop)"
        required: false
        default: "8"
        type: string

permissions:
  contents: write

concurrency:
  group: the-fly-cortex
  cancel-in-progress: true

jobs:
  cortex:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "fly-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run cortex
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=loop; fi
          CYCLES="${{ github.event.inputs.cycles }}"
          if [ -z "$CYCLES" ]; then CYCLES=8; fi
          echo "Running cortex mode=$MODE cycles=$CYCLES"
          python run_cortex.py --mode "$MODE" --cycles "$CYCLES" --interval 40 --max-minutes 45

      - name: Safety push
        run: |
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "cortex: safety commit" || true
          fi
          git fetch origin main
          git pull --rebase origin main || {
            git rebase --abort || true
            git pull origin main --no-rebase --no-edit || true
          }
          git push origin HEAD:main || true
